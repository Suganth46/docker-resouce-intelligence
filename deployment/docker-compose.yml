version: "3.8"

services:
  ollama:
    image: ollama/ollama:0.11.10
    container_name: dri-ollama
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      DRI_LLM_MODEL: ${DRI_LLM_MODEL:-qwen2.5:1.5b}
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    networks: [dri-network]
    # ports:
    #   - "127.0.0.1:11434:11434"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          model=$$DRI_LLM_MODEL; case $$model in *:*) ;; *) model=$$model:latest ;; esac;
          ollama list | awk '{print $$1}' | grep -Fxq "$$model"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  dri-agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: dri-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dri-data:/var/lib/dri
      - ../config/config.yaml:/app/config/config.yaml:ro
    environment:
      DRI_LLM_ENABLED: ${DRI_LLM_ENABLED:-true}
      DRI_LLM_BASE_URL: http://ollama:11434
      DRI_LLM_MODEL: ${DRI_LLM_MODEL:-qwen2.5:1.5b}
      DRI_LOG_LEVEL: "INFO"
      DRI_CONFIG: "/app/config/config.yaml"
    networks:
      - dri-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Prometheus for metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: dri-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - dri-network
    depends_on:
      - dri-agent

  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.dashboard
      args:
        VITE_API_BASE: "http://localhost:8000"
    container_name: dri-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - dri-network
    depends_on:
      - dri-agent

  # ---------------------------------------------------------------------------
  # Optional: TimescaleDB (time-series Postgres extension)
  #
  # Activate with:  docker compose --profile timescale up
  #
  # Then update config/config.yaml:
  #   storage:
  #     backend: "timescaledb"
  #     timescaledb_url: "postgresql+psycopg2://dri:secret@timescaledb:5432/dri"
  #
  # Also install the synchronous driver in the DRI image:
  #   pip install psycopg2-binary
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    profiles: ["timescale"]
    container_name: dri-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: dri
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dri
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - dri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dri -d dri"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ollama-data:
  dri-data:
  prometheus-data:
  timescaledb-data:

networks:
  dri-network:
    driver: bridge
