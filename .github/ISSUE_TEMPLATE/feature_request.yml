name: Feature request
description: Suggest a new capability or improvement to DRI.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task and where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful outcome look like?
      description: Give an example of what you would expect to see or do in DRI.
    validations:
      required: true
