log_level: INFO
log_json: false

collector_interval: 5          # seconds
aggregator_interval: 10        # seconds
policy_check_interval: 10      # seconds

# How often (seconds) to poll all containers (incl. stopped) for status changes.
container_status_interval: 15

# How many minutes to keep a stopped container's window in memory before
# evicting it entirely from the aggregator.
container_status_cleanup_minutes: 5

# Docker log collection and policy signals. Patterns are case-insensitive regexes.
logs:
  llm:
    enabled: false
    provider: ollama
    base_url: http://ollama:11434
    model: qwen2.5:1.5b
    timeout_seconds: 60
    max_input_chars: 1500
    max_output_tokens: 200
    num_ctx: 2048
    temperature: 0.0
    cache_minutes: 10
    queue_size: 20
    probe_interval_seconds: 30
  warmup_minutes: 10  # Observe each container before flagging new error patterns.
  memory_growth_pct: 5
  cpu_saturation_pct: 100  # Docker CPU is per core. Above 100% means more than one core.
  surge_warmup_minutes: 30  # Also requires six completed five-minute windows with traffic.
  enabled: true
  retention_hours: 24  # Log volume typically exceeds metrics volume.
  max_line_length: 1000
  max_lines_per_second: 200  # Per container; warnings, errors and crash signals are exempt.
  flush_interval_seconds: 2.0
  flush_batch_size: 200
  discover_interval_seconds: 15
  max_followed_containers: 50
  error_patterns: [ERROR, FATAL, CRITICAL, Exception, Traceback, panic]
  crash_patterns: [OutOfMemoryError, Killed, connection refused, timed out, too many open files, ECONNREFUSED, no space left]

storage:
  sqlite_path: "/var/lib/dri/metrics.db"

  # retention_hours controls how long raw metric samples are kept in SQLite.
  #
  # This MUST be >= (recommender lookback_days * 24) to avoid computing
  # recommendations on partial history and triggering the data_completeness
  # warning. The recommender default is 7 days (168 h); max lookback is 30
  # days (720 h).
  #
  # Storage size estimate (SQLite, at 5 s collector interval):
  #   ~12 samples/min × 60 min × 24 h × 7 days = ~120,960 rows/container
  #   Each row ≈ ~150 bytes  →  ~18 MB per container per 7 days
  #   10 containers × 7 days ≈ 180 MB total
  #
  # Raise to 720 (30 days) only if you need max-lookback recommendations;
  # budget ~780 MB for 10 containers at that setting.
  retention_hours: 168   # 7 days — matches the recommender's default lookback

  # Reserved settings for planned InfluxDB export. The agent has no writer yet.
  influxdb_enabled: false
  influxdb_url: "http://influxdb:8086"
  influxdb_token: ""
  influxdb_org: "dri"
  influxdb_bucket: "metrics"

  # TimescaleDB (optional alternative backend — Phase 6 spike)
  # Activate with: docker compose --profile timescale up
  # Then set backend to "timescaledb" and provide a connection URL.
  # Install psycopg2-binary in the agent environment for the example URL.
  backend: "sqlite"
  # timescaledb_url: "postgresql+psycopg2://dri:secret@timescaledb:5432/dri"

api:
  host: "0.0.0.0"
  port: 8000
  enable_cors: true
  # CORS allowed origins. Default is ["*"] for development.
  # For production deployments, set this to the dashboard's actual origin(s) explicitly
  # (e.g. ["http://localhost:5173"] or the production dashboard URL) rather than relying
  # on the wildcard default, especially once API-key auth (P2-8) is in place and credentials matter.
  # When set to specific origins (non-wildcard), allow_credentials is automatically enabled.
  allowed_origins:
    - "*"
  prometheus_metrics: true   # Reserved setting. The API always registers /metrics.
  # Optional: When set, all /api/v1/* and /metrics endpoints require X-Api-Key header.
  # Leave null/commented out for local development without authentication.
  # Setting this is strongly recommended for any non-localhost deployment.
  api_key: null

actions:
  throttle:
    cpu_quota: 50000
    memory_limit: "512m"
  isolate_cpuset: "0-1"
  webhook_url: null
  restart_grace_period: 30

# Global default policy (alerts only; opt in by configuring an action rule).
# Shell-style container-name patterns exempt from automatic policy evaluation and actions.
policy_exclude_names: ["dri-*"]
global_policy:
  name: "global"
  selector: {}
  enabled: true
  rules:
    - metric: "memory"
      operator: ">="
      value: 85.0
      duration_seconds: 60
      action: "warning"

    - metric: "cpu"
      operator: ">="
      value: 50.0
      duration_seconds: 15
      action: "warning"

    - metric: "memory_growth_rate_5m"
      operator: ">"
      value: 20.0
      duration_seconds: 30
      action: "warning"

    - metric: "memory"
      operator: ">="
      value: 95.0
      duration_seconds: 10
      action: "warning"

# Per-container policies
container_policies: []
# Example:
#  - name: "high_memory_workload"
